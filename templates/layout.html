<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>🐾CAT GUIDE</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
  />
  <style>
    :root{ --brand-blue:#8EC5FF; --brand-pink:#FFCFE2; --ink:#1b1b1b; }
    body{ color:var(--ink); background:#f7fbff; }
    .navbar-brand .paw{ color:var(--brand-pink); }
    .btn-brand{ background:var(--brand-blue); color:#0b2540; border:none; }
    .btn-brand:hover{ filter:brightness(.95); }
    footer{ background:#0e1b27; color:#cfe6ff; }
  </style>
</head>
<body>

  <!-- 共通ヘッダー -->
  <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">
        <i class="bi bi-paw-fill paw me-1"></i> 🐾CAT GUIDE
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav"
              aria-controls="nav" aria-expanded="false" aria-label="メニュー">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div id="nav" class="collapse navbar-collapse">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/">ホーム</a></li>
          <li class="nav-item"><a class="nav-link" href="/recommend">おすすめ猫種診断</a></li>
          <li class="nav-item"><a class="nav-link" href="/analyze">猫の感情分析</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ページ個別内容をここに挿入 -->
  <main class="container my-4">
    {% block content %}{% endblock %}
  </main>

  <footer class="py-4">
    <div class="container d-flex flex-column flex-lg-row align-items-center justify-content-between">
      <div class="small">© 2025 CAT GUIDE. All rights reserved.</div>
      <div class="small">
        <a href="#" class="me-3 text-decoration-none text-light">利用規約</a>
        <a href="#" class="text-decoration-none text-light">プライバシーポリシー</a>
      </div>
    </div>
  </footer>

  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
    crossorigin="anonymous"
  ></script>
</body>
</html>
